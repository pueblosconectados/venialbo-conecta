# El Worker de los avisos. Ver README.md.
name = "venialbo-avisos"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Sin registros de peticiones: no se guardan IPs ni nada de quién llama
[observability]
enabled = false

# Desde dónde se puede suscribir y dar de baja (separadas por comas)
[vars]
ORIGENES = "https://venialboconecta.es,http://localhost:5173"
# Para el resumen semanal de visitas (no son secretos; el token va aparte, como
# CF_ANALYTICS_TOKEN). El siteTag no es el token del script de la web: ver resumen.js.
CF_ACCOUNT_ID = "5ea58d979dd87f6b54083c23e455ebb3"
CF_SITE_TAG = "3fbf6e812f2d4a2faa040386111c5e89"
# Lo que caduca y no se puede preguntar a nadie, para el aviso y /renovaciones
# (renovaciones.js): [{ "nombre": "…", "fecha": "AAAA-MM-DD", "enlace": "https://…" }].
# Al renovarlo, se cambia la fecha y se vuelve a desplegar.
RENOVACIONES = '[{ "nombre": "Dominio venialboconecta.es", "fecha": "2027-09-21" }]'

# Cada 5 minutos: la vigilancia de GitHub y de la web, y el lunes a las 9:00 de Madrid
# el resumen semanal (lo decide el propio Worker, ver scheduled en index.js). Uno solo,
# porque el plan gratuito da pocos crons por cuenta.
[triggers]
crons = ["*/5 * * * *"]

# Creado con `npx wrangler kv namespace create SUSCRIPCIONES`. En local (`npm run dev`)
# no se usa: wrangler monta un KV de pruebas en .wrangler/.
[[kv_namespaces]]
binding = "SUSCRIPCIONES"
id = "260e7b45d17b4b32858282d641f09b2e"

# El estado de la vigilancia (si GitHub o la web estaban caídos la vez anterior). Aparte
# de SUSCRIPCIONES, que el resumen cuenta y el envío push recorre enteras. Creado con
# `npx wrangler kv namespace create ESTADO`.
[[kv_namespaces]]
binding = "ESTADO"
id = "4d09cf76e6c64019bb1a7ff0a2a6fe15"

# Si los avisos push llegan y cuánto tardan (src/entregas.js). Creada con
# `npx wrangler d1 create venialbo-entregas`; las tablas, en entregas.sql.
[[d1_databases]]
binding = "ENTREGAS"
database_name = "venialbo-entregas"
database_id = "a4f08c41-6355-4846-88d2-fe3cd746580f"
