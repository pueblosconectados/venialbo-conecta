# Configuración de Pages CMS (https://pagescms.org) para web-static/
# Cada guardado hace un commit en main y la GitHub Action republica la web.

# Botones que lanzan workflows de GitHub. En la raiz salen en la barra lateral;
# dentro de media: obligaria a convertirlo al formato de lista con nombre.
actions:
  - name: imagenes-huerfanas
    label: Buscar imágenes sin usar
    workflow: imagenes-huerfanas.yml
    # La rama que se este editando en el CMS (main)
    ref: current

  - name: altas-negocio
    label: Traer las altas de negocio
    workflow: altas-negocio.yml
    ref: current
    confirm:
      title: ¿Traer las altas pendientes?
      message: >-
        Se crean fichas con lo que han mandado los negocios por el formulario, siempre
        ocultas: no se publica nada hasta que las repases aquí y las marques como
        visibles. Las fotos no se traen, se miran en Tally y se suben a mano.
      button: Traer las altas

  - name: anuncios-tablon
    label: Traer los anuncios del tablón
    workflow: anuncios-tablon.yml
    ref: current
    confirm:
      title: ¿Traer los anuncios pendientes?
      message: >-
        Se crean los anuncios que han mandado los vecinos, siempre ocultos y con un mes
        de caducidad: no se publica nada hasta que los repases aquí y los marques como
        visibles. Las fotos no se traen, se miran en Tally y se suben a mano.
      button: Traer los anuncios

  - name: imagenes-huerfanas-pr
    label: Proponer borrar las imágenes sin usar
    workflow: imagenes-huerfanas-pr.yml
    ref: current
    confirm:
      title: ¿Proponer el borrado?
      message: >-
        No se borra nada todavía: se prepara una propuesta en GitHub con la lista
        de imágenes que nadie usa, para revisarla y aceptarla o descartarla.
      button: Preparar la propuesta

# Dos fuentes separadas: al elegir la foto de una noticia no aparecen los PDF,
# y al adjuntar un PDF no aparecen las fotos. Cada campo dice cual usa con
# options.media, que es obligatorio en cuanto hay mas de una.
media:
  - name: imagenes
    label: Imágenes
    input: web-static/public/media/imagenes
    output: /media/imagenes
    categories: [image]
    rename: safe
  - name: documentos
    label: Documentos
    input: web-static/public/media/documentos
    output: /media/documentos
    extensions: [pdf]
    rename: safe

content:
  - name: noticias
    label: Noticias
    type: collection
    path: web-static/content/noticias
    # Sin subcarpetas: build-content.mjs solo lee los .json de primer nivel, y lo
    # que se guardara en una carpeta no saldria en la web. Igual en todas.
    subfolders: false
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: titulo
      fields: [titulo, fecha_publicacion, destacada, activa]
      sort: [fecha_publicacion, titulo]
      search: [titulo]
      default:
        sort: fecha_publicacion
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha_publicacion
        label: Fecha de publicación
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: categoria
        label: Categoría
        type: reference
        required: true
        options:
          collection: categorias
          value: "{path}"
          label: "{nombre}"
          search: nombre
      - name: destacada
        label: Destacada
        type: boolean
        default: false
      - name: activa
        label: Visible en la web
        description: Desmárcala para ocultar la noticia sin borrarla.
        type: boolean
        default: true
      - name: imagen_url
        label: Imagen
        type: image
        options:
          media: imagenes
      - name: contenido
        label: Contenido
        description: Negrita, cursiva, enlaces, listas, encabezados, citas, tablas e imágenes.
        type: rich-text
        required: true
        options:
          # markdown ya es el valor por defecto, pero se deja explícito: se
          # guarda legible en el JSON y la web lo renderiza con markdown-it.
          format: markdown
      - name: documentos
        label: Documentos para descargar
        description: >-
          Hasta 3 archivos PDF, de 10 MB como máximo cada uno. Si alguno se pasa
          de tamaño, la web no se publica hasta quitarlo.
        type: object
        list:
          max: 3
        fields:
          - name: archivo
            label: Archivo PDF
            type: file
            required: true
            options:
              media: documentos
              extensions: [pdf]
          - name: titulo
            label: Título del enlace
            description: Cómo se leerá en la noticia. Si lo dejas vacío, se usa el nombre del archivo.
            type: string

  # El álbum de lo que se ha hecho. La frontera con Noticias: la noticia avisa antes
  # ("el martes empieza el curso") y la actividad cuenta después lo que pasó.
  - name: actividades
    label: Actividades
    description: >-
      Lo que ya se ha hecho en el pueblo, con fotos: un curso, un taller, una
      excursión. Para anunciar algo que va a pasar, usa Noticias.
    type: collection
    path: web-static/content/actividades
    subfolders: false
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: titulo
      fields: [titulo, fecha, categoria, activa]
      sort: [fecha, titulo]
      search: [titulo]
      default:
        sort: fecha
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: fecha
        label: Fecha
        description: El día en que se hizo, o el primero si duró varios.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: fecha_fin
        label: Hasta
        description: Solo si duró varios días. En la web sale "del 3 al 24 de marzo".
        type: date
        options:
          format: yyyy-MM-dd
      # Las etiquetas y los colores de la web están en src/public/pages/actividades/categorias.ts:
      # si se añade una aquí, añadirla también allí.
      - name: categoria
        label: Categoría
        type: select
        required: true
        options:
          values:
            - name: formacion
              label: Formación y talleres
            - name: mayores
              label: Mayores
            - name: infancia
              label: Infancia y juventud
            - name: cultura
              label: Cultura
            - name: deporte
              label: Deporte
            - name: fiestas
              label: Fiestas y tradiciones
            - name: medio-ambiente
              label: Medio ambiente
            - name: salud
              label: Salud
            - name: otra
              label: Otra
      - name: organiza
        label: Organiza
        description: Opcional. El ayuntamiento, una asociación… Enlaza con su ficha de Servicios.
        type: reference
        options:
          collection: servicios
          value: "{path}"
          label: "{nombre}"
          search: nombre
      - name: noticia
        label: Noticia en la que se anunció
        description: Opcional. Enlaza la actividad con la noticia que la anunciaba.
        type: reference
        options:
          collection: noticias
          value: "{path}"
          label: "{titulo}"
          search: titulo
      - name: destacada
        label: Destacada
        type: boolean
        default: false
      - name: activa
        label: Visible en la web
        description: Desmárcala para ocultar la actividad sin borrarla.
        type: boolean
        default: true
      - name: resumen
        label: Resumen
        description: Opcional. Una línea para la tarjeta del listado.
        type: string
      - name: imagen_url
        label: Foto de portada
        description: >-
          Ojo con las fotos de menores: solo si no se les reconoce o con permiso de
          sus padres o tutores.
        type: image
        options:
          media: imagenes
      - name: contenido
        label: Qué se hizo
        description: El relato. Negrita, cursiva, enlaces, listas, encabezados, citas, tablas e imágenes.
        type: rich-text
        options:
          format: markdown
      - name: galeria
        label: Fotos
        description: >-
          Hasta 4, las mejores. Ojo con las fotos de menores: solo si no se les
          reconoce o con permiso de sus padres o tutores. Si hay más, súbelas a un
          álbum y pon el enlace abajo: cada foto que se sube aquí se queda en el
          repositorio para siempre.
        type: object
        list:
          max: 4
        fields:
          - name: imagen
            label: Foto
            type: image
            required: true
            options:
              media: imagenes
          - name: pie
            label: Pie de foto
            description: Opcional. Lo que se lee al ampliarla.
            type: string
      - name: video_url
        label: Vídeo de YouTube
        description: Opcional. El enlace del vídeo, tal cual lo da YouTube al compartir.
        type: string
      - name: album_externo
        label: Álbum con más fotos
        description: Opcional. Un enlace a Google Fotos o similar.
        type: string
      - name: documentos
        label: Documentos para descargar
        description: >-
          Hasta 3 archivos PDF, de 10 MB como máximo cada uno (el temario, un
          díptico…). Si alguno se pasa de tamaño, la web no se publica hasta quitarlo.
        type: object
        list:
          max: 3
        fields:
          - name: archivo
            label: Archivo PDF
            type: file
            required: true
            options:
              media: documentos
              extensions: [pdf]
          - name: titulo
            label: Título del enlace
            description: Cómo se leerá en la actividad. Si lo dejas vacío, se usa el nombre del archivo.
            type: string

  # "Qué ver" de Descubre Venialbo: sitios que se pueden visitar en cualquier momento.
  # Van sobre todo para el que viene de fuera: lo importante es dónde está y si se
  # puede entrar.
  - name: lugares
    label: Lugares (Descubre Venialbo)
    description: >-
      Lo que se puede ver en el pueblo y alrededores: la iglesia, las bodegas, una
      fuente, un mirador. Salen en Descubre Venialbo, en "Qué ver".
    type: collection
    path: web-static/content/lugares
    subfolders: false
    format: json
    filename: "{primary}.json"
    view:
      primary: nombre
      fields: [nombre, tipo, activo]
      sort: [nombre, tipo]
      search: [nombre]
      default:
        sort: nombre
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      # Las etiquetas de la web están en src/public/pages/descubre/lugares.ts:
      # si se añade una aquí, añadirla también allí. Lo mismo con "visitable".
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values:
            - name: religioso
              label: Patrimonio religioso
            - name: popular
              label: Patrimonio popular (bodegas, palomares, lagares, fuentes…)
            - name: naturaleza
              label: Naturaleza y paisaje
            - name: mirador
              label: Mirador
            - name: publico
              label: Edificios y espacios públicos
            - name: otro
              label: Otro
      - name: activo
        label: Visible en la web
        description: Desmárcalo para ocultar el lugar sin borrarlo.
        type: boolean
        default: true
      - name: resumen
        label: Resumen
        description: Opcional. Una línea para la tarjeta del listado.
        type: string
      - name: imagen_url
        label: Foto principal
        type: image
        options:
          media: imagenes
      - name: contenido
        label: Descripción
        description: Qué es, su historia, curiosidades. Negrita, cursiva, enlaces, listas e imágenes.
        type: rich-text
        options:
          format: markdown
      - name: galeria
        label: Más fotos
        description: >-
          Hasta 4. Ojo con las fotos de menores: solo si no se les reconoce o con
          permiso de sus padres o tutores.
        type: object
        list:
          max: 4
        fields:
          - name: imagen
            label: Foto
            type: image
            required: true
            options:
              media: imagenes
          - name: pie
            label: Pie de foto
            description: Opcional. Lo que se lee al ampliarla.
            type: string
      - name: direccion
        label: Dirección
        description: 'Opcional. "Plaza Mayor", "Camino de la Ermita"…'
        type: string
      - name: coordenadas
        label: Coordenadas
        description: >-
          Para el mapa y el botón "Cómo llegar". En Google Maps, pulsa sobre el sitio
          y copia los números que salen (por ejemplo 41.3871, -5.5412). Si no se
          entienden, la web no se publica hasta corregirlas.
        type: string
      - name: visitable
        label: ¿Se puede visitar?
        type: select
        options:
          values:
            - name: abierto
              label: Siempre abierto
            - name: horario
              label: Con horario
            - name: cita
              label: Con cita o preguntando
            - name: fuera
              label: Solo se ve por fuera
      - name: como_visitar
        label: Cómo visitarlo
        description: >-
          Opcional. El horario, o a quién pedir la llave y su teléfono. Lo que le
          haría falta saber a alguien de fuera.
        type: text
      - name: accesible
        label: Accesible en silla de ruedas o con carrito
        type: boolean
        default: false

  - name: negocios
    label: Negocios
    type: collection
    path: web-static/content/negocios
    subfolders: false
    format: json
    filename: "{primary}.json"
    view:
      primary: nombre
      fields: [nombre, categoria_negocio, activo]
      sort: [nombre, categoria_negocio]
      search: [nombre, categoria_negocio]
      default:
        sort: nombre
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: categoria_negocio
        label: Tipo de negocio
        description: "Por ejemplo: Bar, Panadería, Taller…"
        type: string
      - name: descripcion
        label: Descripción
        type: rich-text
        options:
          format: markdown
      - name: logo_url
        label: Logo o foto
        type: image
        options:
          media: imagenes
      - name: direccion
        label: Dirección
        type: string
      - name: telefono
        label: Teléfono fijo
        type: string
      - name: telefono_movil
        label: Teléfono móvil
        type: string
      - name: email
        label: Email
        type: string
      - name: web_url
        label: Página web
        description: Dirección completa, empezando por https://
        type: string
      - name: redes_sociales
        label: Redes sociales
        type: object
        fields:
          - name: facebook
            label: Facebook (URL)
            type: string
          - name: instagram
            label: Instagram (URL)
            type: string
          - name: youtube
            label: YouTube (URL)
            type: string
      - name: horario
        label: Horario
        type: string
      - name: activo
        label: Visible en la web
        type: boolean
        default: true

  - name: servicios
    label: Servicios e instituciones
    type: collection
    path: web-static/content/servicios
    subfolders: false
    format: json
    filename: "{primary}.json"
    view:
      primary: nombre
      fields: [nombre, tipo, activo]
      sort: [nombre, tipo]
      search: [nombre]
      default:
        sort: tipo
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values:
            - name: medico
              label: Médico
            - name: comedor
              label: Comedor
            - name: bibliobus
              label: Bibliobús
            - name: venta_ambulante
              label: Venta ambulante
            - name: asociacion
              label: Asociación
            - name: institucion
              label: Institución
            - name: otro
              label: Otro
      - name: descripcion
        label: Descripción
        type: rich-text
        options:
          format: markdown
      - name: logo_url
        label: Logo o foto
        type: image
        options:
          media: imagenes
      - name: direccion
        label: Dirección
        type: string
      - name: telefono
        label: Teléfono
        type: string
      - name: email
        label: Email
        type: string
      - name: web_url
        label: Página web
        description: Dirección completa, empezando por https://
        type: string
      - name: redes_sociales
        label: Redes sociales
        type: object
        fields:
          - name: facebook
            label: Facebook (URL)
            type: string
          - name: instagram
            label: Instagram (URL)
            type: string
          - name: youtube
            label: YouTube (URL)
            type: string
      - name: horario
        label: Horario
        type: string
      - name: informacion_adicional
        label: Información adicional
        type: text
      - name: activo
        label: Visible en la web
        type: boolean
        default: true

  - name: anuncios
    label: Tablón de anuncios
    type: collection
    path: web-static/content/anuncios
    subfolders: false
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: titulo
      fields: [titulo, tipo, fecha_caducidad, activo]
      sort: [fecha_publicacion, fecha_caducidad, titulo]
      search: [titulo]
      default:
        sort: fecha_publicacion
        order: desc
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: tipo
        label: Tipo
        type: select
        required: true
        options:
          values:
            - name: mascota_perdida
              label: Mascota perdida
            - name: compra_venta
              label: Compra / Venta
            - name: objeto_perdido
              label: Objeto perdido
            - name: otro
              label: Otro
      - name: descripcion
        label: Descripción
        type: rich-text
        options:
          format: markdown
      - name: contacto
        label: Contacto
        description: Teléfono, email o cómo localizar a quien publica.
        type: string
      - name: imagen_url
        label: Imagen
        type: image
        options:
          media: imagenes
      - name: fecha_publicacion
        label: Fecha de publicación
        type: date
        required: true
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
      - name: fecha_caducidad
        label: Visible hasta (incluido)
        description: Pasado este día el anuncio desaparece solo de la web.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: activo
        label: Visible en la web
        type: boolean
        default: true

  - name: avisos
    label: Avisos de portada
    description: >-
      La banda que sale arriba en todas las páginas. Para cosas que caducan: un corte
      de agua, una carretera cortada, un cambio de fecha. NO es el Tablón de anuncios.
    type: collection
    path: web-static/content/avisos
    subfolders: false
    format: json
    filename: "{year}-{month}-{day}-{primary}.json"
    view:
      primary: titulo
      fields: [titulo, nivel, fecha_caducidad, activo]
      sort: [fecha_caducidad, titulo]
      default:
        sort: fecha_caducidad
        order: desc
    fields:
      - name: titulo
        label: Texto del aviso
        description: Una línea. Lo que se lee en la banda.
        type: string
        required: true
      - name: nivel
        label: Nivel
        description: Cambia el color de la banda.
        type: select
        required: true
        default: aviso
        options:
          values:
            - name: urgente
              label: Urgente (rojo)
            - name: aviso
              label: Aviso (ámbar)
            - name: informacion
              label: Información (verde)
      - name: noticia
        label: Noticia relacionada
        description: Opcional. Si la pones, el aviso lleva un enlace para leer más.
        type: reference
        options:
          collection: noticias
          value: "{path}"
          label: "{titulo}"
          search: titulo
      - name: fecha_caducidad
        label: Visible hasta (incluido)
        description: Pasado este día el aviso desaparece solo. Es obligatorio a propósito.
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: activo
        label: Visible en la web
        description: Desmárcalo para bajarlo antes de tiempo.
        type: boolean
        default: true

  - name: categorias
    label: Categorías de noticias
    type: collection
    path: web-static/content/categorias
    subfolders: false
    format: json
    filename: "{primary}.json"
    view:
      primary: nombre
      fields: [nombre, icono, color]
      sort: [nombre]
      default:
        sort: nombre
        order: asc
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
      - name: icono
        label: Icono (emoji)
        type: string
      - name: color
        label: Color
        description: "Código hexadecimal, por ejemplo #4CAF50"
        type: string
